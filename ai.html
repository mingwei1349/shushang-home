<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>数商之家 AI 顾问</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background: var(--bg-soft); }
  .ai-head {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
    color: #fff; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .ai-head a.back { color: #fff; text-decoration: none; font-size: 14px; opacity: .85; }
  .ai-head a.back:hover { opacity: 1; }
  .ai-head .who { display: flex; flex-direction: column; line-height: 1.3; }
  .ai-head .who b { font-size: 16px; }
  .ai-head .who small { font-size: 12px; opacity: .7; }
  .ai-head .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .85; }
  .ai-head .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

  .ai-wrap { max-width: 820px; margin: 0 auto; padding: 18px 16px 140px; }
  .ai-box { min-height: 52vh; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; gap: 10px; max-width: 92%; }
  .msg .av {
    flex: 0 0 38px; width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--navy-700), var(--blue-500));
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .av { background: linear-gradient(135deg, var(--orange-500), var(--orange-400)); }
  .msg .bubble {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 14px; font-size: 15px; line-height: 1.7; box-shadow: var(--shadow-sm);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--orange-500), var(--orange-400)); color: #fff; border: none; }

  .typing .bubble { color: var(--text-3); }
  .typing .bubble i { display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 50%; background: var(--text-3); animation: blink 1.2s infinite; }
  .typing .bubble i:nth-child(2) { animation-delay: .2s; }
  .typing .bubble i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  .ai-input {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: #fff; border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .ai-input .row { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .ai-input textarea {
    flex: 1; resize: none; border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 11px 14px; font-family: var(--font); font-size: 15px; line-height: 1.5; max-height: 120px; outline: none;
  }
  .ai-input textarea:focus { border-color: var(--blue-500); }
  .ai-input button {
    flex: 0 0 auto; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, var(--navy-700), var(--blue-500)); color: #fff;
    padding: 0 20px; height: 46px; font-size: 15px; font-weight: 600;
  }
  .ai-input button:disabled { opacity: .5; cursor: not-allowed; }
  .ai-tip { max-width: 820px; margin: 6px auto 0; font-size: 12px; color: var(--text-3); text-align: center; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .quick span {
    font-size: 13px; color: var(--navy-600); background: #fff; border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .quick span:hover { border-color: var(--blue-500); }
</style>
</head>
<body>

<div class="ai-head">
  <a class="back" href="index.html">← 首页</a>
  <div class="who">
    <b>数商之家 AI 顾问</b>
    <small>数字经济 · 数据要素 · 数据资产</small>
  </div>
  <div class="status"><span class="dot"></span>在线</div>
</div>

<div class="ai-wrap">
  <div class="ai-box" id="box">
    <div class="msg">
      <div class="av">数</div>
      <div class="bubble">您好，我是「数商之家」AI 顾问 👋\n您可以问我关于数字经济、数据要素、数据资产入表、数商学习路径、明威老师课程等等问题。回复「人工」可转接顾问微信。</div>
    </div>
  </div>
</div>

<div class="ai-input">
  <div class="row">
    <div style="flex:1;display:flex;flex-direction:column;gap:8px">
      <div class="quick" id="quick">
        <span>什么是数据要素？</span>
        <span>数据资产怎么入表？</span>
        <span>数商学习路径</span>
        <span>明威老师是谁？</span>
      </div>
      <textarea id="input" rows="1" placeholder="输入您的问题，Enter 发送…"></textarea>
    </div>
    <button id="send">发送</button>
  </div>
  <div class="ai-tip">本顾问由 AI 驱动，回答仅供参考；重要内容以官方政策与明威老师课程为准。</div>
</div>

<script>
// ====== 配置：部署 Cloudflare Workers 后，把下面的地址替换成您的 Worker 地址 ======
const WORKER_URL = "https://shushang-ai-advisor.workers.dev/api/chat";

const box = document.getElementById("box");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const quick = document.getElementById("quick");

const SYSTEM_PROMPT = "你是「数商之家」的 AI 顾问，一个聚焦数字经济、数据要素、数据资产化的专业助手。" +
  "你用通俗易懂的中文回答，擅长把复杂政策翻译成人话，把产业趋势拆解成可执行动作。" +
  "你服务个人与企业用户，介绍数商学习路径、数据资产入表、公共数据授权运营、数字IP打造等主题。" +
  "当用户表达想找真人时，引导其加微信 19852697@qq.com 或电话 13149481331，备注「数商之家」。" +
  "回答简洁有结构，适当使用要点。不要编造不确定的政策细节。";

let history = [{ role: "system", content: SYSTEM_PROMPT }];

function addMsg(role, text, typing) {
  const el = document.createElement("div");
  el.className = "msg " + role + (typing ? " typing" : "");
  el.innerHTML = '<div class="av">' + (role === "user" ? "我" : "数") + '</div>' +
    '<div class="bubble">' + (typing ? "<i></i><i></i><i></i>" : escapeHtml(text)) + '</div>';
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return el;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

async function ask(text) {
  if (!text.trim()) return;
  addMsg("user", text);
  history.push({ role: "user", content: text });
  input.value = ""; input.style.height = "auto";
  sendBtn.disabled = true;
  const loading = addMsg("ai", "", true);

  try {
    const resp = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    if (!resp.ok) throw new Error("服务返回 " + resp.status);
    const data = await resp.json();
    const reply = (data.choices && data.choices[0].message.content) || "（暂无回复）";
    history.push({ role: "assistant", content: reply });
    loading.classList.remove("typing");
    loading.querySelector(".bubble").textContent = reply;
  } catch (e) {
    loading.classList.remove("typing");
    loading.querySelector(".bubble").textContent = "暂时连不上顾问服务，请稍后再试，或直接加微信 19852697@qq.com。";
  } finally {
    sendBtn.disabled = false;
    box.scrollTop = box.scrollHeight;
  }
}

sendBtn.addEventListener("click", () => ask(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; });
quick.addEventListener("click", e => {
  if (e.target.tagName === "SPAN") ask(e.target.textContent);
});
</script>
</body>
</html>
